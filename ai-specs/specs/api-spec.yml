# NOTE: This is a workspace-level overview of the YOM platform APIs.
# Each service has its own complete API documentation in its respective CLAUDE.md
# and/or service-level api-spec. Use this file as a map to understand the
# multi-service topology and the shared conventions applied across all services.

openapi: 3.0.0
info:
  title: YOM Platform API — Workspace Overview
  description: |
    YOM is a **multi-service SaaS platform**. Each backend service runs independently
    and exposes its own HTTP API. This spec documents the shared conventions and
    provides representative endpoint coverage for the `customer` service (banners,
    FAQs). For the full API of each service, refer to its own CLAUDE.md or
    service-level api-spec file.

    ## Service Topology

    | Service       | Base URL                        | Responsibility                          |
    |---------------|---------------------------------|-----------------------------------------|
    | yom-api       | `http://localhost:3000/v2/`     | Core API (Express + Moleculer)          |
    | yom-gateway   | `http://localhost:3100/v3/`     | B2B gateway (aggregates service calls)  |
    | customer      | `http://localhost:3016/`        | Banners, FAQs, T&Cs, announcements      |
    | fintech       | `http://localhost:3017/`        | Payment providers, payment documents    |
    | orders        | `http://localhost:3018/`        | Order management                        |

    ## Authentication

    All endpoints require a valid JWT issued by `@yomcl/jwt-verify`.
    Pass the token as a Bearer token in the `Authorization` header:

    ```
    Authorization: Bearer <jwt>
    ```

    ## Shared Response Conventions

    **List responses** return a `data + metadata` envelope:
    ```json
    {
      "data": [...],
      "metadata": { "total": 100, "page": 1, "limit": 20, "totalPages": 5 }
    }
    ```

    **Mutation responses** (create / update / delete) return a `message + data` envelope:
    ```json
    {
      "message": "Banner created successfully",
      "data": { ... }
    }
    ```

    **Error responses** always include `message` and an optional `error` detail:
    ```json
    {
      "message": "Banner not found",
      "error": "NOT_FOUND"
    }
    ```

    ## customerId Convention

    Most resources are scoped to a customer (tenant). Provide `customerId` as a
    required query parameter on list/create calls, or it is inferred from the JWT
    claims when the service supports it.

  version: 1.0.0
  contact:
    name: YOM Engineering
    email: diego@yom.ai
  license:
    name: Private

servers:
  - url: http://localhost:3016
    description: customer service — local development
  - url: http://localhost:3017
    description: fintech service — local development
  - url: http://localhost:3018
    description: orders service — local development
  - url: http://localhost:3000/v2
    description: yom-api — local development
  - url: http://localhost:3100/v3
    description: yom-gateway — local development

security:
  - BearerAuth: []

tags:
  - name: Banners
    description: |
      Promotional banners scoped to a customer. Served on storefronts and B2B portals.
      Base path: `http://localhost:3016/banners`
  - name: FAQs
    description: |
      Frequently asked questions scoped to a customer.
      Base path: `http://localhost:3016/faqs`
  - name: _Overview
    description: Workspace topology — no executable endpoints at this level.

paths:
  # ---------------------------------------------------------------------------
  # BANNERS — customer service (http://localhost:3016)
  # ---------------------------------------------------------------------------
  /banners:
    get:
      summary: List banners for a customer
      description: |
        Returns a paginated list of banners scoped to the given `customerId`.
        Results are ordered by `position` ascending by default.
      tags:
        - Banners
      parameters:
        - $ref: '#/components/parameters/CustomerIdQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Banners retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      summary: Create a banner
      description: Creates a new promotional banner for the given customer.
      tags:
        - Banners
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBannerRequest'
      responses:
        '201':
          description: Banner created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /banners/{id}:
    get:
      summary: Get a banner by ID
      description: Returns the full detail of a single banner.
      tags:
        - Banners
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Banner retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Banner'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      summary: Update a banner
      description: |
        Performs a full or partial update of a banner. Only fields present in the
        request body are modified; omitted fields retain their current values.
      tags:
        - Banners
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBannerRequest'
      responses:
        '200':
          description: Banner updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      summary: Delete a banner
      description: Permanently removes a banner. This action is irreversible.
      tags:
        - Banners
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Banner deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # FAQs — customer service (http://localhost:3016)
  # ---------------------------------------------------------------------------
  /faqs:
    get:
      summary: List FAQs for a customer
      description: Returns a paginated list of FAQ entries scoped to the given `customerId`.
      tags:
        - FAQs
      parameters:
        - $ref: '#/components/parameters/CustomerIdQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: FAQs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaqListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      summary: Create a FAQ entry
      description: Creates a new FAQ entry for the given customer.
      tags:
        - FAQs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFaqRequest'
      responses:
        '201':
          description: FAQ created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaqMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  # ---------------------------------------------------------------------------
  # Security
  # ---------------------------------------------------------------------------
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT issued by `@yomcl/jwt-verify`. Include in every request:
        `Authorization: Bearer <token>`

  # ---------------------------------------------------------------------------
  # Reusable parameters
  # ---------------------------------------------------------------------------
  parameters:
    CustomerIdQuery:
      in: query
      name: customerId
      required: true
      schema:
        type: string
      description: Tenant identifier. All resources are scoped to a customer.
      example: "cust_abc123"

    ResourceId:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: Unique resource identifier (UUID or numeric string depending on service).
      example: "banner_xyz789"

    PageQuery:
      in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number for pagination.

    LimitQuery:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Number of records per page.

  # ---------------------------------------------------------------------------
  # Reusable responses
  # ---------------------------------------------------------------------------
  responses:
    BadRequest:
      description: Validation error or invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: "customerId is required"
            error: "VALIDATION_ERROR"

    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: "Unauthorized"
            error: "INVALID_TOKEN"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: "Banner not found"
            error: "NOT_FOUND"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: "Internal server error"
            error: "INTERNAL_ERROR"

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------
  schemas:

    # --- Shared ---

    PaginationMetadata:
      type: object
      description: Pagination info returned on every list response.
      properties:
        total:
          type: integer
          description: Total number of records matching the query.
          example: 42
        page:
          type: integer
          description: Current page number.
          example: 1
        limit:
          type: integer
          description: Records returned per page.
          example: 20
        totalPages:
          type: integer
          description: Total number of pages.
          example: 3
      required:
        - total
        - page
        - limit
        - totalPages

    ErrorResponse:
      type: object
      description: Standard error envelope used across all YOM services.
      properties:
        message:
          type: string
          description: Human-readable error description.
          example: "Banner not found"
        error:
          type: string
          description: Machine-readable error code (optional).
          example: "NOT_FOUND"
      required:
        - message

    DeleteResponse:
      type: object
      description: Confirmation envelope for delete mutations.
      properties:
        message:
          type: string
          example: "Banner deleted successfully"
        data:
          type: object
          description: The deleted resource (or its ID).
          properties:
            id:
              type: string
              example: "banner_xyz789"
      required:
        - message

    # --- Banner ---

    Banner:
      type: object
      description: A promotional banner associated with a customer (tenant).
      properties:
        id:
          type: string
          description: Unique banner identifier.
          example: "banner_xyz789"
        customerId:
          type: string
          description: Owning customer (tenant) identifier.
          example: "cust_abc123"
        title:
          type: string
          description: Display title of the banner.
          example: "Summer Sale"
        imageUrl:
          type: string
          format: uri
          description: URL of the banner image asset.
          example: "https://cdn.yom.ai/banners/summer-sale.png"
        linkUrl:
          type: string
          format: uri
          nullable: true
          description: Optional CTA URL the banner links to.
          example: "https://store.yom.ai/summer"
        position:
          type: integer
          description: Display order (ascending = higher priority).
          example: 1
        isActive:
          type: boolean
          description: Whether the banner is currently shown.
          default: true
          example: true
        startsAt:
          type: string
          format: date-time
          nullable: true
          description: Scheduled start of visibility window.
        endsAt:
          type: string
          format: date-time
          nullable: true
          description: Scheduled end of visibility window.
        createdAt:
          type: string
          format: date-time
          description: Record creation timestamp.
        updatedAt:
          type: string
          format: date-time
          description: Record last-update timestamp.
      required:
        - id
        - customerId
        - title
        - imageUrl
        - position
        - isActive

    CreateBannerRequest:
      type: object
      properties:
        customerId:
          type: string
          description: Owning customer (tenant) identifier.
          example: "cust_abc123"
        title:
          type: string
          description: Display title of the banner.
          example: "Summer Sale"
        imageUrl:
          type: string
          format: uri
          description: URL of the banner image asset.
          example: "https://cdn.yom.ai/banners/summer-sale.png"
        linkUrl:
          type: string
          format: uri
          nullable: true
          description: Optional CTA URL.
        position:
          type: integer
          description: Display order.
          example: 1
        isActive:
          type: boolean
          default: true
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
      required:
        - customerId
        - title
        - imageUrl
        - position

    UpdateBannerRequest:
      type: object
      description: All fields are optional — only provided fields are updated.
      properties:
        title:
          type: string
        imageUrl:
          type: string
          format: uri
        linkUrl:
          type: string
          format: uri
          nullable: true
        position:
          type: integer
        isActive:
          type: boolean
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true

    BannerListResponse:
      type: object
      description: Paginated list of banners.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Banner'
        metadata:
          $ref: '#/components/schemas/PaginationMetadata'
      required:
        - data
        - metadata

    BannerMutationResponse:
      type: object
      description: Response envelope for banner create/update operations.
      properties:
        message:
          type: string
          example: "Banner created successfully"
        data:
          $ref: '#/components/schemas/Banner'
      required:
        - message
        - data

    # --- FAQ ---

    Faq:
      type: object
      description: A FAQ entry associated with a customer (tenant).
      properties:
        id:
          type: string
          description: Unique FAQ identifier.
          example: "faq_001"
        customerId:
          type: string
          description: Owning customer (tenant) identifier.
          example: "cust_abc123"
        question:
          type: string
          description: The question text.
          example: "How do I track my order?"
        answer:
          type: string
          description: The answer text (supports markdown).
          example: "You can track your order from the **My Orders** section."
        category:
          type: string
          nullable: true
          description: Optional category for grouping FAQs.
          example: "Orders"
        position:
          type: integer
          description: Display order within the FAQ list.
          example: 1
        isActive:
          type: boolean
          description: Whether the FAQ is currently visible.
          default: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - customerId
        - question
        - answer
        - position
        - isActive

    CreateFaqRequest:
      type: object
      properties:
        customerId:
          type: string
          description: Owning customer (tenant) identifier.
          example: "cust_abc123"
        question:
          type: string
          description: The question text.
          example: "How do I track my order?"
        answer:
          type: string
          description: The answer text.
          example: "From the My Orders section."
        category:
          type: string
          nullable: true
        position:
          type: integer
          example: 1
        isActive:
          type: boolean
          default: true
      required:
        - customerId
        - question
        - answer
        - position

    FaqListResponse:
      type: object
      description: Paginated list of FAQ entries.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Faq'
        metadata:
          $ref: '#/components/schemas/PaginationMetadata'
      required:
        - data
        - metadata

    FaqMutationResponse:
      type: object
      description: Response envelope for FAQ create/update operations.
      properties:
        message:
          type: string
          example: "FAQ created successfully"
        data:
          $ref: '#/components/schemas/Faq'
      required:
        - message
        - data
